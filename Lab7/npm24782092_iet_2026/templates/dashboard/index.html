{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <h2 class="text-center mb-4">📊 Dashboard Laporan</h2>

    <!-- ===================== -->
    <!-- CHART SECTION -->
    <!-- ===================== -->
    <div class="row">
        <!-- Grafik Kategori -->
        <div class="col-md-6">
            <div class="card shadow p-3">
                <h5 class="text-center">Laporan per Kategori</h5>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <!-- Grafik Status -->
        <div class="col-md-6">
            <div class="card shadow p-3">
                <h5 class="text-center">Laporan per Status</h5>
                <canvas id="statusChart"></canvas>
            </div>
        </div>
    </div>

    <!-- ===================== -->
    <!-- TABLE SECTION -->
    <!-- ===================== -->
    <div class="row mt-4">

        <!-- REPORTED -->
        <div class="col-md-6">
            <div class="card shadow p-3">
                <h5 class="text-center">📌 5 Laporan Terbaru (REPORTED)</h5>
                <table class="table table-bordered table-sm">
                    <thead class="table-light">
                        <tr>
                            <th>Judul</th>
                            <th>Kategori</th>
                            <th>Lokasi</th>
                        </tr>
                    </thead>
                    <tbody id="reportedTable"></tbody>
                </table>
            </div>
        </div>

        <!-- RESOLVED -->
        <div class="col-md-6">
            <div class="card shadow p-3">
                <h5 class="text-center">✅ 5 Laporan Terbaru (RESOLVED)</h5>
                <table class="table table-bordered table-sm">
                    <thead class="table-light">
                        <tr>
                            <th>Judul</th>
                            <th>Kategori</th>
                            <th>Lokasi</th>
                        </tr>
                    </thead>
                    <tbody id="resolvedTable"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- ===================== -->
<!-- CHART JS -->
<!-- ===================== -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
fetch('/dashboard/stats/')
.then(response => response.json())
.then(data => {

    // =====================
    // CATEGORY CHART
    // =====================
    const categoryLabels = data.category_data.map(item => item.category);
    const categoryValues = data.category_data.map(item => item.total);

    new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: {
            labels: categoryLabels,
            datasets: [{
                label: 'Jumlah Laporan',
                data: categoryValues,
            }]
        }
    });

    // =====================
    // STATUS CHART
    // =====================
    const statusLabels = data.status_data.map(item => item.status);
    const statusValues = data.status_data.map(item => item.total);

    new Chart(document.getElementById('statusChart'), {
        type: 'pie',
        data: {
            labels: statusLabels,
            datasets: [{
                data: statusValues,
            }]
        }
    });

    // =====================
    // TABLE REPORTED
    // =====================
    const reportedTable = document.getElementById('reportedTable');
    data.latest_reported.forEach(item => {
        reportedTable.innerHTML += `
            <tr>
                <td>${item.title}</td>
                <td>${item.category}</td>
                <td>${item.location}</td>
            </tr>
        `;
    });

    // =====================
    // TABLE RESOLVED
    // =====================
    const resolvedTable = document.getElementById('resolvedTable');
    data.latest_resolved.forEach(item => {
        resolvedTable.innerHTML += `
            <tr>
                <td>${item.title}</td>
                <td>${item.category}</td>
                <td>${item.location}</td>
            </tr>
        `;
    });

});
</script>

{% endblock %}
