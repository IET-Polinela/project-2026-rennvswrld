<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Warga Smart City Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* 🎨 Desain Tema Utama Biru Muda TRI & Elemen Global */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f8fa; /* Abu-abu cerah dengan hint biru lembut */
            color: #2c3e50;
        }

        /* Navigasi Premium Tema Biru Muda TRI (Sesuai dengan aplikasi monolitik) */
        .navbar-tri {
            background: linear-gradient(135deg, #4da3ff 0%, #2980b9 100%) !important;
            box-shadow: 0 4px 15px rgba(41, 128, 185, 0.15);
            padding: 14px 0;
        }

        .navbar-brand-tri {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
        }

        /* Wadah Konten SPA */
        .spa-container {
            min-height: calc(100vh - 90px);
        }

        /* Card Custom Styling */
        .card-custom {
            border: none !important;
            border-radius: 16px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03) !important;
            background-color: #ffffff;
        }

        .border-dashed-custom {
            border: 2px dashed #d1dbe3 !important;
            border-radius: 16px;
        }

        /* 🔵 EDIT SAKTI DI SINI: MENYALAKAN WARNA GARIS COUNTDOWN SWEETALERT2 BIAR KONTRAS */
        .swal2-timer-progress-bar {
            background: linear-gradient(to right, #4da3ff, #2980b9) !important;
            height: 5px !important; /* Membuat garis countdown sedikit lebih tebal agar terlihat jelas */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-tri shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold navbar-brand-tri d-flex align-items-center" href="#">
                <i class="bi bi-buildings-fill me-2"></i>Smart City Portal SPA
            </a>
            
            <div id="nav-menus" class="ms-auto"></div>
        </div>
    </nav>

    <main class="container-fluid px-4 mt-4 spa-container" id="app-content"></main>


    <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="reportModalLabel">
                        <i class="bi bi-pencil-square me-2"></i>Buat Laporan Baru
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-body p-4">
                    <form id="reportForm">
                        
                        <input type="hidden" id="reportId"> 
                        <div class="mb-3">
                            <label for="inputTitle" class="form-label small fw-bold text-secondary">Judul Laporan</label>
                            <input type="text" class="form-control bg-light py-2 shadow-none small" id="inputTitle" placeholder="Masukkan judul keluhan Anda..." required>
                        </div>

                        <div class="mb-3">
                            <label for="inputCategory" class="form-label small fw-bold text-secondary">Kategori Laporan</label>
                            <select class="form-select bg-light py-2 shadow-none small" id="inputCategory" required>
                                <option value="" disabled selected>-- Pilih Kategori --</option>
                                <option value="INFRASTRUCTURE">Infrastruktur</option>
                                <option value="ENVIRONMENT">Lingkungan</option>
                                <option value="CRIME">Kriminalitas</option>
                                <option value="OTHER">Lainnya</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="inputLocation" class="form-label small fw-bold text-secondary">Lokasi Kejadian</label>
                            <input type="text" class="form-control bg-light py-2 shadow-none small" id="inputLocation" placeholder="Contoh: Gedung Lab Analisis" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="inputDescription" class="form-label small fw-bold text-secondary">Deskripsi Keluhan</label>
                            <textarea class="form-control bg-light py-2 shadow-none small" id="inputDescription" rows="4" placeholder="Ceritakan detail rincian atau kronologi keluhan..." required></textarea>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <button type="button" class="btn btn-outline-secondary fw-bold px-4" id="btnDraft">Simpan Draft</button>
                            <button type="button" class="btn btn-primary fw-bold px-4" id="btnSubmit">Ajukan <i class="bi bi-send-fill ms-1"></i></button>
                        </div>
                        
                    </form>
                </div>
                
            </div>
        </div>
    </div>
    <!-- 🔔 Container untuk notifikasi toast custom (dipakai showToast() di app.js) -->
    <div id="toast-wrap" style="position: fixed; top: 20px; right: 20px; z-index: 1080; display: flex; flex-direction: column; gap: 10px;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>
</body>
</html>
