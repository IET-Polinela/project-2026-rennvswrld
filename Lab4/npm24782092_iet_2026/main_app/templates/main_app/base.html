<!DOCTYPE html>
<html>
<head>
    <title>Sistem Laporan Kota</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Style -->
    <style>
        body {
            background-color: #f4f6f9;
        }

        /* Navbar */
        .navbar {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Card */
        .card {
            border-radius: 12px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* Button */
        .btn {
            border-radius: 8px;
        }

        /* Status Badge */
        .badge-reported {
            background-color: #6c757d;
        }

        .badge-verified {
            background-color: #0dcaf0;
        }

        .badge-process {
            background-color: #ffc107;
            color: black;
        }

        .badge-resolved {
            background-color: #198754;
        }

        /* Heading */
        .page-title {
            font-weight: bold;
        }

        .subtitle {
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">🚧 Sistem Pelaporan</a>
    
    <div>
      <a href="/" class="btn btn-outline-light btn-sm">Home</a>
      <a href="/about/" class="btn btn-outline-light btn-sm">About</a>
      <a href="/contacts/" class="btn btn-outline-light btn-sm">Contacts</a>
    </div>
  </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">

    <!-- HEADER GLOBAL -->
    <div class="text-center mb-4">
        <h2 class="page-title">{% block title %}Smart City Issue Reporting{% endblock %}</h2>
        <p class="subtitle">Laporkan masalah kota dengan cepat & mudah</p>
    </div>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
