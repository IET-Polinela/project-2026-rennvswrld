{% extends 'base.html' %}

{% block title %}Login - Warung 092{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card border-0 shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Login Internal</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Masukkan username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Masuk ke Sistem</button>
                </form>
            </div>
        </div>
        <p class="text-center mt-3 text-muted small">Fokus: Keamanan & Konsep Asinkron</p>
    </div>
</div>
{% endblock %}
